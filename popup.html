<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Here for ChatGPT</title>
  <style>
    :root {
      --ink: #14120f;
      --muted: #6b645c;
      --line: #e6dfd4;
      --paper: #fbf7f0;
      --accent: #c45c26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 18px 18px 16px;
      background:
        radial-gradient(120% 80% at 0% 0%, #fff 0%, transparent 55%),
        linear-gradient(165deg, #f7f1e8 0%, #efe6d8 100%);
      color: var(--ink);
      font: 13px/1.45 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font: 700 16px/1.2 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -0.02em;
    }
    .tag {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .card {
      padding: 12px 12px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
    }
    .label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    a.mail {
      display: inline-block;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
    }
    a.mail:hover { text-decoration: underline; }
    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11.5px;
    }
  </style>
</head>
<body>
  <h1>Ask Here</h1>
  <p class="tag">Answers stay where you are reading.</p>
  <div class="card">
    <p class="label">Contact us</p>
    <a class="mail" href="mailto:mehdigho1994@gmail.com">mehdigho1994@gmail.com</a>
  </div>
  <p class="hint">Select text on chatgpt.com → Ask here</p>
  <p class="hint"><a class="mail" href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></p>
</body>
</html>
